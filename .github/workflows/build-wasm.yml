name: Build Pyodide backend

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.3
      - name: Build
        run: |
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DBUILD_EXECUTABLES=OFF -DGPU_DOWNLOADER=OFF
          cmake --build build-wasm --target libausaxs -j2
          mkdir -p wasm-release/lib
          cp build-wasm/lib/libausaxs.so wasm-release/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: libausaxs-pyemscripten-2026-0
          path: wasm-release/
          if-no-files-found: error
