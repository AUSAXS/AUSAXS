name: Weekly ASan and coverage

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  unit-tests:
    name: Unit tests with ASan and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev
          python3 -m pip install --disable-pip-version-check gcovr==8.4

      - name: Configure
        run: |
          cmake -B build-asan-coverage -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSAFE_CHECKS=ON \
            -DENABLE_ADDRESS_SANITIZER=ON \
            -DENABLE_COVERAGE=ON

      - name: Build unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build build-asan-coverage --target unit_tests -j12

      - name: Run unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          find build-asan-coverage -name '*.gcda' -delete
          python3 scripts/run_instrumented_unit_tests.py \
            build-asan-coverage/tests/unit/bin \
            --timeout 5 \
            --output-directory asan-coverage-unit-results

      - name: Upload unit-test timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-coverage-unit-results
          path: asan-coverage-unit-results
          retention-days: 14

      - name: Generate coverage report
        run: |
          gcovr --root . \
            --object-directory build-asan-coverage \
            --filter 'source/' \
            --exclude '.*_deps/.*' \
            --cobertura-pretty \
            --output coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: true
          use_oidc: true