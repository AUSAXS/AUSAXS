name: Build & sign release binaries

on:
  workflow_dispatch:

permissions:
  checks: write

env:
  BUILD_TYPE: Release

jobs:
  check-version:
    name: "Check that version number has been incremented"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check build version
        run: |
          VERSION_FILE="include/core/constants/Version.h"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "Version file not found: $VERSION_FILE"
            exit 1
          fi

          # extract the version string from the file (e.g. "v1.2.3")
          VERSION_IN_FILE=$(sed -n -E 's/.*version\[\]\s*=\s*"([^"]+)".*/\1/p' "$VERSION_FILE" || true)
          if [ -z "$VERSION_IN_FILE" ]; then
            echo "Could not extract version from file: $VERSION_FILE"
            exit 1
          fi

          # try to get the most recent tag (prefer git describe --abbrev=0)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "Version in file: $VERSION_IN_FILE"
          echo "Latest git tag: $LATEST_TAG"

          # normalize by removing a leading 'v' or 'V' so tags like 'v1.2.3' compare to '1.2.3'
          normalize() { echo "${1}" | sed -E 's/^[vV]//'; }
          norm_file=$(normalize "$VERSION_IN_FILE")
          norm_tag=$(normalize "$LATEST_TAG")

          if [ "$norm_file" = "$norm_tag" ]; then
            echo "Version number has not been incremented since the last tag."
            echo "Please update the version number in $VERSION_FILE."
            exit 1
          else
            echo "Version number has been incremented."
          fi

  build-win: 
    name: "Windows MSVC"
    needs: check-version
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/AUSAXS/index.json,readwrite"

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      # pinned so the build does not float on the vcpkg bundled with the runner image
      - uses: lukka/run-vcpkg@v11
        id: vcpkg
        with:
          vcpkgGitCommitId: 4334d8b4c8916018600212ab4dd4bbdc343065d1

      - uses: ./.github/actions/setup-vcpkg-nuget
        with:
          package_permission: true
          nuget_cmd: "$(vcpkg fetch nuget)"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: pwsh
        run: |
          & "${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}\vcpkg.exe" install curl pkgconf --triplet x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the library
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="x64-windows-static"
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12

      - name: Configure output folders for upload
        shell: bash
        run: |
          rm -rf build/lib/*.exp build/lib/*.lib

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/lib/*
            build/bin/*

  build-mac:
    name: "MacOS universal"
    needs: check-version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: | 
          brew install --quiet curl

      - name: Build the library
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12  

      - name: Sign the artifacts
        env: 
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PWD: ${{ secrets.MACOS_P12_PASSWORD }}
          KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          DEV_ID: ${{ secrets.MACOS_DEV_ID }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/keychain

          echo -n $CERTIFICATE_BASE64 | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p $KEYCHAIN_PWD $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PWD $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P $CERTIFICATE_PWD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k $KEYCHAIN_PWD $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          codesign --deep --verify --force --verbose --options runtime --timestamp --sign "$DEV_ID" build/bin/ausaxs
    
      - name: Notarize saxs_fitter
        uses: lando/notarize-action@v2
        with: 
          product-path: build/bin/ausaxs
          primary-bundle-id: "com.ausaxs.ausaxs"
          appstore-connect-username: ${{ secrets.MACOS_APP_USR }}
          appstore-connect-password: ${{ secrets.MACOS_APP_PWD }}
          appstore-connect-team-id: ${{ secrets.MACOS_APP_TEAM_ID }}
          verbose: true

      - name: Configure output folders for upload
        shell: bash
        run: |
          rm -rf build/lib/*.a

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-binaries
          path: |
            build/lib/*
            build/bin/*

  build-ubuntu:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy: 
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Ubuntu latest with GCC"
            c_compiler: gcc
            cpp_compiler: g++
            full_build: true

          - os: ubuntu-22.04
            name: "Ubuntu 22.04 with GCC"
            c_compiler: gcc-10
            cpp_compiler: g++-10
            full_build: false

          - os: ubuntu-24.04-arm
            name: "Ubuntu 24.04 ARM with GCC"
            c_compiler: gcc
            cpp_compiler: g++
            full_build: true

          - os: ubuntu-22.04-arm
            name: "Ubuntu 22.04 ARM with GCC"
            c_compiler: gcc-10
            cpp_compiler: g++-10
            full_build: false

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev
          if [ "${{ matrix.c_compiler }}" == "gcc-10" ]; then
            sudo apt-get install gcc-10 g++-10
          fi
          if [ $BUILD_TYPE == 'Debug' ]; then
            sudo apt-get install libdwarf-dev
          fi

      - name: Build the library (full build)
        if: matrix.full_build == true
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12

      - name: Build the library (${{ matrix.os }})
        if: matrix.full_build == false
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12

      - name: Configure output folders for upload
        shell: bash
        run: |
          rm -rf build/lib/*.a

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            build/lib/*
            build/bin/*