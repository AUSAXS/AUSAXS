name: Build GPU backend

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths:
      - 'source/gpu/**'
      - 'include/gpu/**'
      - '.github/workflows/build-gpu-backend.yml'
  workflow_call:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

  # Every version pin lives here and nowhere else.
  LLVM_VERSION: "21"
  CUDA_VERSION: "12.6"
  ROCM_VERSION: "7.2.4"
  ACPP_REPO: "https://github.com/AdaptiveCpp/AdaptiveCpp"
  ACPP_COMMIT: "d2272b04"
  ACPP_PREFIX: "/opt/acpp"
  DIST: "/opt/ausaxs-gpu-dist"

jobs:
  gate:
    name: "Changed since last build?"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          filter: blob:none

      - id: verified
        uses: ./.github/actions/last-verified-sha
        if: github.event_name == 'pull_request'
        with:
          workflow: build-gpu-backend.yml
          job-name: "SYCL backend"
          head-sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether the backend needs rebuilding
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        run: |
          set -euo pipefail

          decide() {
            echo "build=$1" >> "$GITHUB_OUTPUT"
            echo "$2"
            printf '%s\n' "**Backend build: $([ "$1" = true ] && echo 'running' || echo 'skipped')** -- $2" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          # workflow_dispatch and workflow_call carry no diff to reason about, and are only ever
          # reached by someone asking for a build.
          if [ "$EVENT" != 'pull_request' ]; then
            decide true "triggered by ${EVENT}, not a pull request"
            exit 0
          fi
          if [ "$IS_DRAFT" = 'true' ]; then
            decide false "the pull request is a draft"
            exit 0
          fi

          if [ -n "$VERIFIED_SHA" ]; then
            baseline=$VERIFIED_SHA
            reason="since the last successful build, at ${baseline:0:8}"
          else
            # A pull request's first run, and any case where the lookup came up short. The merge
            # base is what `paths:` itself compared against, so this is the old behaviour exactly:
            # the gate can only ever be an improvement on it, never a regression.
            baseline=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)
            reason="against the merge base ${baseline:0:8} (no earlier successful build on this history)"
          fi

          # As in the lookup, losing the answer has to cost a build rather than skip one.
          if [ -z "$baseline" ] \
            || ! changed=$(git diff --name-only "$baseline" "$HEAD_SHA" -- \
                 'source/gpu' 'include/gpu' '.github/workflows/build-gpu-backend.yml'); then
            decide true "no usable baseline to compare against"
            exit 0
          fi

          if [ -n "$changed" ]; then
            printf 'changed:\n%s\n' "$changed"
            decide true "backend sources changed ${reason}"
          else
            decide false "no backend sources changed ${reason}"
          fi

  backend:
    name: "SYCL backend (Linux x86_64)"
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up size accounting
        run: |
          cat > /tmp/sizes.sh <<'HELPER'
          _used_kb() { df --output=used -k / | tail -1 | tr -d ' '; }
          _total_kb() { df --output=size -k / | tail -1 | tr -d ' '; }
          _avail_kb() { df --output=avail -k / | tail -1 | tr -d ' '; }
          _human() {
            awk -v k="${1:-0}" 'BEGIN {
              sign = (k < 0 ? "-" : ""); k = (k < 0 ? -k : k);
              if (k >= 1048576) printf "%s%.1f GiB", sign, k / 1048576;
              else if (k >= 1024) printf "%s%.0f MiB", sign, k / 1024;
              else printf "%s%d KiB", sign, k;
            }'
          }

          # Bracket a step with `size_begin` and `size_end <label> [installed tree]`.
          size_begin() { _size_before=$(_used_kb); }
          size_end() {
            _label=$1
            _tree=${2:-}
            _delta=$(( $(_used_kb) - _size_before ))
            _avail=$(_avail_kb)
            _tree_size="--"
            if [ -n "$_tree" ] && [ -e "$_tree" ]; then
              # Resolved first because /opt/rocm is a symlink to /opt/rocm-<version>, and du
              # measures the link itself rather than its target: 0 KiB for a multi-gigabyte tree.
              _resolved=$(readlink -f "$_tree" 2>/dev/null || echo "$_tree")
              _tree_kb=$(du -sk "$_resolved" 2>/dev/null | cut -f1)
              [ -z "$_tree_kb" ] && _tree_kb=$(sudo du -sk "$_resolved" 2>/dev/null | cut -f1)
              [ -n "$_tree_kb" ] && _tree_size=$(_human "$_tree_kb")
            fi
            printf '| %s | %s | %s | %s | %s |\n' \
              "$_label" "$(_human "$_delta")" "${_tree:---}" "$_tree_size" "$(_human "$_avail")" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "size: ${_label}: delta $(_human "$_delta"), tree ${_tree_size}, $(_human "$_avail") free"

            # The disk-clearing step below exists because these toolchains do not fit on a stock
            # runner. This warning is the early signal that they have outgrown even what it buys;
            # without it the first symptom is an ENOSPC in some unrelated later step.
            if [ "$_avail" -lt 10485760 ]; then
              echo "::warning::only $(_human "$_avail") free on / after ${_label}"
            fi
          }
          HELPER
          . /tmp/sizes.sh
          {
            echo '## Dependency sizes'
            echo
            # Recorded because the job's disk budget is set by the runner image, which is not a
            # stable quantity: GitHub documents ~14 GB free on a standard hosted runner and has
            # at times provided far more. If this line ever shrinks back toward the documented
            # figure, the peak row below is what says whether this job still fits.
            printf '_Runner disk: %s total, %s free before cleanup._\n' \
              "$(_human "$(_total_kb)")" "$(_human "$(_avail_kb)")"
            echo
            echo '| Step | Disk delta | Installed tree | Tree size | Free after |'
            echo '|---|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          . /tmp/sizes.sh
          size_begin
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo apt-get -qq purge -y '^ghc-.*' '^dotnet-.*' '^llvm-1[0-9].*' azure-cli firefox || true
          sudo apt-get -qq autoremove -y
          df -h /
          size_end 'Free disk space (reclaimed)'

      - name: Install base dependencies
        run: |
          . /tmp/sizes.sh
          size_begin
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            libcurl4-openssl-dev libnuma-dev \
            ocl-icd-opencl-dev opencl-headers \
            upx-ucl lsb-release wget gnupg ca-certificates
          size_end 'Base dependencies'

      # apt.llvm.org is flaky often enough that AdaptiveCpp's own CI retries it; keep the loop.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          set -e
          . /tmp/sizes.sh
          size_begin
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          success=0
          for i in 1 2 3 4 5; do
            if sudo ./llvm.sh "$LLVM_VERSION"; then success=1; break; fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$success" -ne 1 ]; then echo "llvm.sh failed after 5 attempts"; exit 1; fi
          sudo apt-get -qq install -y \
            "clang-tools-${LLVM_VERSION}" \
            "libclang-${LLVM_VERSION}-dev" \
            "libomp-${LLVM_VERSION}-dev" \
            "lld-${LLVM_VERSION}" \
            "llvm-${LLVM_VERSION}-dev"
          sudo apt-get -qq install -y -o DPkg::options::="--force-overwrite" \
            "libclang-rt-${LLVM_VERSION}-dev"
          rm llvm.sh
          size_end "LLVM ${LLVM_VERSION}" "/usr/lib/llvm-${LLVM_VERSION}"

      - name: Install CUDA ${{ env.CUDA_VERSION }}
        if: env.CUDA_VERSION != ''
        run: |
          set -e
          . /tmp/sizes.sh
          size_begin
          suffix="${CUDA_VERSION//./-}"
          distro="$(lsb_release -is | tr '[:upper:]' '[:lower:]')$(lsb_release -rs | tr -d '.')"
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/${distro}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb && rm cuda-keyring_1.1-1_all.deb
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            "cuda-cudart-dev-${suffix}" "cuda-driver-dev-${suffix}" "cuda-nvcc-${suffix}"
          size_end "CUDA ${CUDA_VERSION}" "/usr/local/cuda-${CUDA_VERSION}"

      - name: Install ROCm ${{ env.ROCM_VERSION }}
        if: env.ROCM_VERSION != ''
        run: |
          set -e
          . /tmp/sizes.sh
          size_begin
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-1001
          sudo apt-get -qq update

          # hipcc and rocminfo are the two packages Ubuntu also ships; rocm-dev is the metapackage
          # actually requested. If apt's candidate for any of them is not AMD's repo, the pin is
          # not doing its job and the install below would produce a mismatched toolchain.
          for pkg in rocm-dev hipcc rocminfo; do
            policy=$(apt-cache policy "$pkg")
            echo "$policy"
            candidate=$(echo "$policy" | awk '/Candidate:/ {print $2}')
            source=$(echo "$policy" | awk -v v="$candidate" '$1 == v {hit=1; next} hit {print; exit}')
            case "$source" in
              *repo.radeon.com*)
                echo "  ok  ${pkg} ${candidate} resolves to repo.radeon.com" ;;
              *)
                echo "::error::${pkg} candidate ${candidate} resolves to '${source:-nothing}', not repo.radeon.com"
                echo "  the apt pin in /etc/apt/preferences.d/rocm-pin-1001 is not taking effect."
                exit 1 ;;
            esac
          done

          sudo apt-get -qq install -y rocm-dev
          df -h /
          size_end "ROCm ${ROCM_VERSION}" /opt/rocm

      - name: Build AdaptiveCpp
        run: |
          set -e
          . /tmp/sizes.sh
          size_begin
          # A user-owned prefix keeps the whole step unprivileged. Building or installing as root
          # leaves a root-owned build tree, which the cleanup below then cannot remove -- fatal
          # under `set -e`, after the build has already succeeded.
          sudo mkdir -p "$ACPP_PREFIX" && sudo chown "$(id -u):$(id -g)" "$ACPP_PREFIX"
          git clone --recurse-submodules "$ACPP_REPO" /tmp/acpp
          cd /tmp/acpp
          git checkout "$ACPP_COMMIT"
          git submodule update --init --recursive

          if [ -n "$CUDA_VERSION" ]; then
            cuda_args="-DWITH_CUDA_BACKEND=ON -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-${CUDA_VERSION}"
          else
            cuda_args="-DWITH_CUDA_BACKEND=OFF"
          fi
          if [ -n "$ROCM_VERSION" ]; then
            rocm_args="-DWITH_ROCM_BACKEND=ON -DROCM_PATH=/opt/rocm"
          else
            rocm_args="-DWITH_ROCM_BACKEND=OFF"
          fi

          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ACPP_PREFIX" \
            -DCMAKE_C_COMPILER="/usr/bin/clang-${LLVM_VERSION}" \
            -DCMAKE_CXX_COMPILER="/usr/bin/clang++-${LLVM_VERSION}" \
            -DCLANG_EXECUTABLE_PATH="/usr/bin/clang++-${LLVM_VERSION}" \
            -DLLVM_DIR="/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm" \
            -DClang_DIR="/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/clang" \
            -DACPP_COMPILER_FEATURE_PROFILE=full \
            -DWITH_OPENCL_BACKEND=ON \
            $cuda_args $rocm_args
          # Installed, not just built: `acpp`, the headers, the CMake package config and the
          # deployment manifests are what the deploy, configure and build steps below consume.
          #
          # It must be `--build --target install`, never `cmake --install build`. AdaptiveCpp
          # installs the SPIR-V translator from an `install(CODE)` hook that shells out to
          # `cmake --build . --target InstallLLVMSpirvTranslator`, and `.` is the build directory
          # only when the install runs as a build target; `cmake --install` runs it in whatever
          # directory it was invoked from. The hook passes no RESULT_VARIABLE, so getting this
          # wrong installs an AdaptiveCpp missing llvm-spirv and reports success.
          cmake --build build --target install
          "$ACPP_PREFIX/bin/acpp" --version

          # Guards exactly that: the hook cannot report its own failure, so check its output. The
          # alternative is finding out eight minutes later, when deploying the ocl component dies
          # on the missing binary.
          spirv="$ACPP_PREFIX/lib/hipSYCL/ext/llvm-spirv/bin/llvm-spirv"
          if [ ! -x "$spirv" ]; then
            echo "::error::AdaptiveCpp installed without ${spirv}"
            echo "  its install(CODE) hook for InstallLLVMSpirvTranslator failed silently."
            exit 1
          fi
          echo "  ok  llvm-spirv installed at ${spirv}"

          # Reported before the build tree is deleted, because this is the job's high-water mark
          # and therefore the only row that answers "would this still fit on a smaller runner?".
          size_end 'AdaptiveCpp (peak, before cleanup)' /tmp/acpp
          cd / && rm -rf /tmp/acpp
          # Measured after the build tree is gone, so this is the installed toolchain alone.
          size_end 'AdaptiveCpp' "$ACPP_PREFIX"

      - name: Deploy runtime components
        run: |
          set -e
          export PATH="$ACPP_PREFIX/bin:$PATH"
          sudo mkdir -p "$DIST" && sudo chown "$(id -u):$(id -g)" "$DIST"

          deploy_and_check() {
            component=$1
            sentinel=$2
            echo "=== deploying component: ${component} ==="
            acpp "--acpp-deploy=${component}:${DIST}/${component}"
            if [ -n "$sentinel" ] && [ ! -e "${DIST}/${component}/${sentinel}" ]; then
              echo "::error::component '${component}' deployed without '${sentinel}'"
              echo "  --acpp-deploy reports missing files as 'acpp error:' lines but still exits 0,"
              echo "  so check the log above. Usually it means the backend was not built: verify"
              echo "  the matching -DWITH_*_BACKEND and that the SDK was found at configure time."
              exit 1
            fi
          }

          deploy_and_check core "libacpp-rt.so"
          if [ -n "$CUDA_VERSION" ]; then
            deploy_and_check cuda "hipSYCL/ext/bitcode/ptx/libdevice.10.bc"
          fi
          if [ -n "$ROCM_VERSION" ]; then
            deploy_and_check hip "hipSYCL/ext/bitcode/amdgcn/ockl.bc"
          fi
          deploy_and_check ocl "hipSYCL/librt-backend-ocl.so"
          du -sh "$DIST"/*

      - name: Configure AUSAXS
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DAdaptiveCpp_ROOT="$ACPP_PREFIX" \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXECUTABLES=OFF \
            -DDLIB=OFF

      - name: Build backend
        run: cmake --build build --target ausaxs_gpu_sycl -j$(nproc)

      - name: Check exported ABI symbols
        run: |
          set -euo pipefail
          lib=build/lib/libausaxs_gpu_sycl.so
          test -f "$lib"
          expected=$(grep -oE 'symbol_[a-z_]+ *= *"ausaxs_gpu_[a-z_]+"' include/gpu/gpu/GPUBackendABI.h \
            | grep -oE 'ausaxs_gpu_[a-z_]+' | sort -u)
          test -n "$expected"
          # Symbols are dumped once to a file rather than piped into `grep -q` per symbol. Under
          # `pipefail` that pipe reports failure for every symbol that IS present: grep -q exits on
          # the first match, nm dies of SIGPIPE, and pipefail propagates nm's status.
          nm -D --defined-only "$lib" > /tmp/backend_syms.txt
          missing=0
          for sym in $expected; do
            if grep -qw "$sym" /tmp/backend_syms.txt; then
              echo "  ok      $sym"
            else
              echo "  MISSING $sym"
              missing=1
            fi
          done
          exit $missing

      - name: Assemble runtime package
        run: |
          set -euo pipefail
          mkdir -p dist/merged
          for component in "$DIST"/*/; do
            name=$(basename "$component")
            mkdir -p "dist/$name"
            cp -r "$component"/* "dist/$name/"
            cp -r "$component"/* dist/merged/
          done
          cp build/lib/libausaxs_gpu_sycl.so dist/
          cp build/lib/libausaxs_gpu_sycl.so dist/merged/
          du -sh dist/*

      - name: Compress libLLVM
        continue-on-error: true
        run: |
          set -uo pipefail
          for lib in dist/core/libLLVM.so.*; do
            [ -f "$lib" ] || continue
            before=$(stat -c%s "$lib")
            if upx --best "$lib"; then
              echo "$lib: $before -> $(stat -c%s "$lib") bytes"
            else
              echo "upx declined $lib; shipping it uncompressed"
            fi
          done

      - name: Load backend and query the ABI
        run: |
          set -euo pipefail
          expected_version=$(grep -oE 'version *= *[0-9]+' include/gpu/gpu/GPUBackendABI.h \
            | grep -oE '[0-9]+' | head -1)
          echo "Header declares ABI version ${expected_version}"
          cat > /tmp/abi_probe.c <<'PROBE'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char** argv) {
              void* h = dlopen(argv[1], RTLD_NOW);
              if (!h) {printf("dlopen failed: %s\n", dlerror()); return 2;}
              int (*abi_version)(void) = dlsym(h, "ausaxs_gpu_abi_version");
              int (*available)(void) = dlsym(h, "ausaxs_gpu_available");
              const char* (*last_error)(void) = dlsym(h, "ausaxs_gpu_last_error");
              if (!abi_version || !available || !last_error) {printf("dlsym failed: %s\n", dlerror()); return 3;}
              printf("abi_version=%d\n", abi_version());
              printf("available=%d\n", available() ? 1 : 0);
              const char* err = last_error();
              printf("last_error=%s\n", err ? err : "(none)");
              return 0;
          }
          PROBE
          cc -O0 -o /tmp/abi_probe /tmp/abi_probe.c -ldl
          # The version is parsed out of stdout rather than returned as the exit status, so that
          # bumping the ABI can never collide with the probe's own failure codes.
          set +e
          out=$(LD_LIBRARY_PATH="$PWD/dist/merged:${LD_LIBRARY_PATH:-}" \
            /tmp/abi_probe "$PWD/dist/merged/libausaxs_gpu_sycl.so" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::the backend could not be loaded from the deployed package (probe exit $rc)"
            exit 1
          fi
          reported=$(echo "$out" | grep -oE '^abi_version=[0-9]+' | cut -d= -f2)
          if [ "$reported" != "$expected_version" ]; then
            echo "::error::backend reports ABI version '$reported', header declares '$expected_version'"
            exit 1
          fi
          echo "ABI version $reported matches the header."

      - name: Report dependencies resolved outside the package
        continue-on-error: true
        run: |
          {
            echo '## Dependencies resolved outside the runtime package'
            echo '```'
            LD_LIBRARY_PATH="$PWD/dist/merged" \
              ldd $(find "$PWD/dist/merged" -type f | grep -v '\.bc$') 2>/dev/null \
              | grep -v "$PWD/dist/merged" | awk '{print $3;}' | sort -u | grep -v '^$'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-backend-linux-x64
          path: dist/libausaxs_gpu_sycl.so

      - uses: actions/upload-artifact@v4
        with:
          name: gpu-runtime-core-linux-x64
          path: dist/core/*

      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/cuda/**') != ''
        with:
          name: gpu-runtime-cuda-linux-x64
          path: dist/cuda/*

      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/hip/**') != ''
        with:
          name: gpu-runtime-hip-linux-x64
          path: dist/hip/*

      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/ocl/**') != ''
        with:
          name: gpu-runtime-ocl-linux-x64
          path: dist/ocl/*
