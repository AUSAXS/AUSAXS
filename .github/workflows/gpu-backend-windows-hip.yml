name: GPU backend (Windows, HIP)

# Manual only, while the HIP path on Windows is being brought up. A HIP-only sibling of gpu-backend-windows.yml (CUDA), kept separate so
# its failures cannot touch the CUDA build; fold it into that workflow once it is green.
#
# AdaptiveCpp's own CI never builds HIP on Windows (its windows-acppllvm.yml is CUDA only), but upstream reports the HIP backend working
# there with the generic JIT (AdaptiveCpp issue #1023). ROCm comes from AMD's TheRock pip wheels rather than the classic HIP SDK
# installer, as llama.cpp does: the wheels are current (the HIP SDK installer lags far behind) and install without administrator rights.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write # publishing the toolchain package

env:
  BUILD_TYPE: Release
  WINDOWS_LLVM_VERSION: "20"
  WINDOWS_BASE_LLVM_VERSION: "19"
  WINDOWS_ROCM_VERSION: "10.1.0"
  ROCM_INDEX: https://stable.repo.amd.com/rocm/whl-next/

jobs:
  backend-windows-hip:
    name: "SYCL backend (Windows x86_64, HIP)"
    runs-on: windows-2022
    env:
      ACPP_PREFIX: ${{ github.workspace }}\_acpp
      ACPP_LLVM_SRC: ${{ github.workspace }}\_src
      DIST: ${{ github.workspace }}\_deploy
      GPU_PACKAGE: dist\ausaxs-gpu-windows-hip-x64
      # A fixed path: the ROCm root is compiled into the toolchain and is part of its description, so it must be the same in every run
      # for a published toolchain to be found again.
      ROCM_VENV: C:\rocm-venv
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The AdaptiveCpp pin shared with the other GPU backend builds. Carriage returns stripped, since Windows checks text files out
      # with CRLF line endings.
      - name: Load the AdaptiveCpp pin
        shell: bash
        run: grep -vE '^[[:space:]]*(#|$)' .github/gpu-backend.env | tr -d '\r' >> "$GITHUB_ENV"

      # clang-cl and the build of LLVM below both need the MSVC environment, and so does dumpbin.
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # Needed on a toolchain hit too: the device bitcode and the runtime DLLs are copied out of it into the package. The core wheel holds
      # the runtime, hipRTC, comgr and the device libraries; devel adds the CMake configs, as a tarball that `rocm-sdk init` unpacks.
      - name: Install ROCm ${{ env.WINDOWS_ROCM_VERSION }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv $env:ROCM_VENV
          & "$env:ROCM_VENV\Scripts\python.exe" -m pip install --no-cache-dir --upgrade pip
          & "$env:ROCM_VENV\Scripts\python.exe" -m pip install --no-cache-dir --index-url $env:ROCM_INDEX "rocm[devel]==$env:WINDOWS_ROCM_VERSION"
          $rocmsdk = "$env:ROCM_VENV\Scripts\rocm-sdk.exe"
          & $rocmsdk init
          $root = (& $rocmsdk path --root).Trim()
          Write-Host "ROCm root: $root"

          $missing = 0
          foreach ($file in 'lib\llvm\amdgcn\bitcode\ockl.bc', 'lib\amdhip64.lib', 'lib\hiprtc.lib', 'lib\llvm\bin\clang.exe') {
            if (Test-Path (Join-Path $root $file)) { Write-Host "  ok      $file" }
            else { Write-Host "  MISSING $file"; $missing = 1 }
          }
          if ($missing) { Write-Host "::error::the ROCm root lacks files the toolchain build needs"; exit 1 }
          # Without it AdaptiveCpp falls back to ROCM_LIBS, which the toolchain description sets for exactly this case.
          if (-not (Get-ChildItem -Recurse -File (Join-Path $root 'lib\cmake') -Filter hip-config.cmake -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::no hip-config.cmake under $root\lib\cmake; AdaptiveCpp will link amdhip64 through ROCM_LIBS"
          }

          # hipRTC hands our bitcode to comgr, which reads it with ROCm's own LLVM. Bitcode only reads forward, so ROCm's LLVM must be
          # at least as new as ours. AdaptiveCpp checks this itself, but not when it is built as part of LLVM, as here.
          $version = & "$root\lib\llvm\bin\clang.exe" --version | Out-String
          Write-Host $version
          $major = [regex]::Match($version, 'clang version ([0-9]+)').Groups[1].Value
          if (-not $major -or ([int]$major -lt [int]$env:WINDOWS_LLVM_VERSION)) {
            Write-Host "::error::ROCm's LLVM ($major) is older than the LLVM AdaptiveCpp is built with ($env:WINDOWS_LLVM_VERSION)"
            exit 1
          }

          # Forward slashes, since every use is a CMake path, and deploy matches the device library entry on its trailing '/*'.
          "ROCM_ROOT=$($root -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # One argument per line. The build step configures with exactly these, and the file's hash is the package version, so a changed
      # flag or pin can never fetch a toolchain that was built another way.
      - name: Describe the AdaptiveCpp-LLVM toolchain
        id: toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pins = "# image=$env:ImageOS llvm=release/$env:WINDOWS_LLVM_VERSION.x base-llvm=$env:WINDOWS_BASE_LLVM_VERSION " +
                  "rocm=$env:WINDOWS_ROCM_VERSION acpp=$env:ACPP_REPO@$env:ACPP_COMMIT"
          # LINK_INTO_TOOLS is what makes this work at all: a Windows DLL cannot be loaded into clang as a plugin, so the SSCP compiler
          # has to be linked into clang itself.
          # ROCM_DEVICE_LIBS_PATH is needed because AdaptiveCpp looks for the device libraries in $ROCM_PATH/amdgcn/bitcode, while
          # TheRock keeps them under lib/llvm. ROCM_LIBS is only read if find_package(HIP) fails; its default is a GNU-style -L/-l
          # line that clang-cl cannot link with.
          $cmakeArgs = @(
            '-S', "$env:ACPP_LLVM_SRC\llvm\llvm",
            '-B', "$env:ACPP_LLVM_SRC\build",
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_C_COMPILER=clang-cl',
            '-DCMAKE_CXX_COMPILER=clang-cl',
            "-DCMAKE_INSTALL_PREFIX=$env:ACPP_PREFIX",
            '-DLLVM_TARGETS_TO_BUILD=X86;AMDGPU',
            '-DLLVM_ENABLE_PROJECTS=clang;openmp;lld;compiler-rt',
            '-DLLVM_PARALLEL_LINK_JOBS=1',
            '-DLLVM_EXTERNAL_PROJECTS=AdaptiveCpp',
            "-DLLVM_EXTERNAL_ADAPTIVECPP_SOURCE_DIR=$env:ACPP_LLVM_SRC\acpp",
            '-DLLVM_ADAPTIVECPP_LINK_INTO_TOOLS=ON',
            '-DWITH_CUDA_BACKEND=OFF',
            '-DWITH_ROCM_BACKEND=ON',
            '-DWITH_OPENCL_BACKEND=OFF',
            "-DROCM_PATH=$env:ROCM_ROOT",
            "-DROCM_DEVICE_LIBS_PATH=$env:ROCM_ROOT/lib/llvm/amdgcn/bitcode",
            "-DROCM_LIBS=$env:ROCM_ROOT/lib/amdhip64.lib",
            '-DLLVM_TOOL_BUGPOINT_BUILD=OFF',
            '-DOPENMP_ENABLE_LIBOMPTARGET=OFF',
            '-DLLVM_INCLUDE_TESTS=OFF'
          )
          New-Item -ItemType Directory -Force _toolchain | Out-Null
          @($pins) + $cmakeArgs | Set-Content _toolchain\acpp-llvm.txt
          Get-Content _toolchain\acpp-llvm.txt

          # Its own package id, so it can never be mistaken for the CUDA toolchain of gpu-backend-windows.yml.
          $hash = (Get-FileHash _toolchain\acpp-llvm.txt -Algorithm SHA256).Hash.ToLower()
          "package=adaptivecpp-llvm-hip_x64-windows" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$env:WINDOWS_LLVM_VERSION.0.0-acpp$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The toolchain is kept as a package on the organisation's GitHub Packages NuGet feed, beside vcpkg's binary cache. Unlike
      # actions/cache, packages are never evicted and are visible to every branch.
      - name: Configure the package feed
        env:
          FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          FEED_USER: ${{ github.repository_owner }}
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) { $nuget = & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" fetch nuget | Select-Object -Last 1 }
          & $nuget sources add -Name AUSAXS -Source $env:FEED -UserName $env:FEED_USER -Password $env:FEED_TOKEN -StorePasswordInClearText
          "NUGET=$nuget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Never fails: anything short of a complete toolchain is a miss, and a miss costs a rebuild.
      - name: Fetch AdaptiveCpp-LLVM
        id: fetch
        env:
          PACKAGE: ${{ steps.toolchain.outputs.package }}
          VERSION: ${{ steps.toolchain.outputs.version }}
        run: |
          $tar = "$env:SystemRoot\System32\tar.exe" # bsdtar; Git's GNU tar may shadow a bare `tar`
          $pkg = "$env:RUNNER_TEMP\toolchain-package"
          & $env:NUGET install $env:PACKAGE -Version $env:VERSION -Source AUSAXS -OutputDirectory $pkg -NonInteractive -DirectDownload
          $archive = Get-ChildItem -Recurse -File -Path $pkg -Filter acpp-llvm.tar.gz -ErrorAction SilentlyContinue | Select-Object -First 1
          if (($LASTEXITCODE -eq 0) -and $archive) {
            New-Item -ItemType Directory -Force $env:ACPP_PREFIX | Out-Null
            & $tar -xzf $archive.FullName -C $env:ACPP_PREFIX
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Using the published toolchain $env:PACKAGE $env:VERSION"
              "hit=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Remove-Item -Recurse -Force $pkg
              exit 0
            }
            Write-Host "::warning::$env:PACKAGE $env:VERSION could not be unpacked; building it instead"
            Remove-Item -Recurse -Force $env:ACPP_PREFIX -ErrorAction SilentlyContinue
          } else {
            Write-Host "No published toolchain $env:PACKAGE $env:VERSION; building it"
          }
          "hit=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Install LLVM ${{ env.WINDOWS_BASE_LLVM_VERSION }} (bootstrap compiler)
        if: steps.fetch.outputs.hit != 'true'
        uses: ZhongRuoyu/setup-llvm@v0.2.0
        with:
          llvm-version: ${{ env.WINDOWS_BASE_LLVM_VERSION }}

      - name: Install Ninja
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip" -OutFile "$env:RUNNER_TEMP\ninja.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\ninja.zip" -DestinationPath "$env:RUNNER_TEMP\ninja"
          "$env:RUNNER_TEMP\ninja" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # About 40 minutes, and only ever run once per toolchain description.
      - name: Build LLVM ${{ env.WINDOWS_LLVM_VERSION }} with AdaptiveCpp
        if: steps.fetch.outputs.hit != 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:LLVM_PATH\bin;$env:PATH"

          git clone --depth 1 --single-branch -b "release/$env:WINDOWS_LLVM_VERSION.x" https://github.com/llvm/llvm-project "$env:ACPP_LLVM_SRC\llvm"
          git clone --recurse-submodules $env:ACPP_REPO "$env:ACPP_LLVM_SRC\acpp"
          git -C "$env:ACPP_LLVM_SRC\acpp" checkout $env:ACPP_COMMIT
          git -C "$env:ACPP_LLVM_SRC\acpp" submodule update --init --recursive

          $cmakeArgs = Get-Content _toolchain\acpp-llvm.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          cmake @cmakeArgs
          cmake --build "$env:ACPP_LLVM_SRC\build" --target install

          # Only the installed toolchain is needed from here on, and the build tree is most of the disk.
          Remove-Item -Recurse -Force $env:ACPP_LLVM_SRC

      # Published straight after the build, so the build is kept even when a later step fails. Allowed to fail, so a read-only token
      # still gets a build.
      #
      # The tree goes in as one archive rather than as package content, because NuGet percent-encodes file names such as clang++.exe
      # inside the package.
      - name: Publish AdaptiveCpp-LLVM
        if: steps.fetch.outputs.hit != 'true'
        continue-on-error: true
        env:
          PACKAGE: ${{ steps.toolchain.outputs.package }}
          VERSION: ${{ steps.toolchain.outputs.version }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tar = "$env:SystemRoot\System32\tar.exe"
          $staging = "$env:RUNNER_TEMP\toolchain-publish"
          New-Item -ItemType Directory -Force $staging | Out-Null
          & $tar -czf "$staging\acpp-llvm.tar.gz" -C $env:ACPP_PREFIX .

          $description = "NOT FOR DIRECT USE. The AdaptiveCpp-LLVM toolchain the Windows HIP GPU backend is built with, " +
                         "published by gpu-backend-windows-hip.yml so it is only built once. Built from: " +
                         ((Get-Content _toolchain\acpp-llvm.txt) -join ' ')
          # The repository element links the package to this repository, which is what lets later runs read it.
          $nuspec = @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd">
            <metadata>
              <id>$env:PACKAGE</id>
              <version>$env:VERSION</version>
              <authors>AUSAXS</authors>
              <description>$([System.Security.SecurityElement]::Escape($description))</description>
              <repository type="git" url="$env:REPOSITORY_URL" />
            </metadata>
            <files>
              <file src="acpp-llvm.tar.gz" target="tools" />
            </files>
          </package>
          "@
          Set-Content -Path "$staging\toolchain.nuspec" -Value $nuspec
          & $env:NUGET pack "$staging\toolchain.nuspec" -BasePath $staging -OutputDirectory $staging -NoPackageAnalysis -NonInteractive
          $nupkg = Get-ChildItem "$staging\*.nupkg" | Select-Object -First 1
          '{0}: {1:N0} MiB' -f $nupkg.Name, ($nupkg.Length / 1MB)
          & $env:NUGET push $nupkg.FullName -Source AUSAXS -ApiKey $env:FEED_TOKEN -Timeout 3600 -NonInteractive
          Remove-Item -Recurse -Force $staging

      - name: Check the toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python "$env:ACPP_PREFIX\bin\acpp" --version
          foreach ($file in 'bin\clang.exe', 'bin\hipSYCL\rt-backend-hip.dll') {
            if (-not (Test-Path "$env:ACPP_PREFIX\$file")) {
              Write-Host "::error::the AdaptiveCpp-LLVM install has no $file"
              exit 1
            }
          }

      - name: Deploy runtime components
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          function Deploy-Component([string]$component, [string]$sentinel) {
            Write-Host "=== deploying component: $component ==="
            python "$env:ACPP_PREFIX\bin\acpp" "--acpp-deploy=${component}:$env:DIST\$component"
            if (-not (Test-Path "$env:DIST\$component\$sentinel")) {
              Write-Host "::error::component '$component' deployed without '$sentinel'"
              Write-Host "  --acpp-deploy reports missing files as warnings but still exits 0, so check the log above."
              exit 1
            }
          }

          Deploy-Component core 'acpp-rt.dll'
          Deploy-Component hip 'hipSYCL\ext\bitcode\amdgcn\ockl.bc'

          # The CPU plugin, rt-backend-omp.dll, imports libomp.dll, and AdaptiveCpp terminates the process when no CPU backend loads,
          # even if a GPU backend did. The core manifest names libomp by find_library, which on Windows finds the import library, so
          # the DLL is never deployed. It goes beside acpp-rt.dll, whose directory the runtime adds to the plugins' DLL search path.
          $libomp = Get-ChildItem -Recurse -File $env:ACPP_PREFIX -Filter 'libomp.dll' | Select-Object -First 1
          if (-not $libomp) { Write-Host "::error::no libomp.dll in $env:ACPP_PREFIX"; exit 1 }
          Copy-Item $libomp.FullName "$env:DIST\core\"
          Write-Host "deployed $($libomp.FullName)"

          # The hip manifest names ROCm's libraries by find_library, which on Windows finds the import libraries (amdhip64.lib, ...)
          # rather than the DLLs, so none of the runtime is deployed. Copy every DLL the deployed component imports from ROCm, and
          # theirs in turn. hiprtc-builtins and comgr are loaded with LoadLibrary rather than imported, so dumpbin cannot see them.
          $hip = "$env:DIST\hip"
          $rocmBin = Join-Path $env:ROCM_ROOT 'bin'
          $queue = [System.Collections.Generic.Queue[string]]::new()
          foreach ($dll in (Get-ChildItem -Recurse -File $hip -Filter *.dll)) { $queue.Enqueue($dll.FullName) }
          foreach ($dll in (Get-ChildItem -File -Path "$rocmBin\*" -Include 'hiprtc-builtins*.dll', 'amd_comgr*.dll')) {
            Copy-Item $dll.FullName "$hip\"
            Write-Host "deployed $($dll.FullName)"
            $queue.Enqueue("$hip\$($dll.Name)")
          }
          $seen = @{}
          while ($queue.Count -gt 0) {
            $current = $queue.Dequeue()
            $imports = dumpbin /nologo /dependents $current | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
            foreach ($name in $imports) {
              $source = Join-Path $rocmBin $name
              if ($seen.ContainsKey($name.ToLower()) -or -not (Test-Path $source) -or (Test-Path "$hip\$name")) { continue }
              $seen[$name.ToLower()] = $true
              Copy-Item $source "$hip\"
              Write-Host "deployed $source (imported by $(Split-Path -Leaf $current))"
              $queue.Enqueue("$hip\$name")
            }
          }

          # hiprtc missing means llvm-to-amdgpu was built without ACPP_HIPRTC_LINK, and would instead run clang at JIT time, which the
          # package does not ship.
          $missing = 0
          foreach ($pattern in 'amdhip64_*.dll', 'hiprtc0*.dll', 'hiprtc-builtins*.dll', 'amd_comgr*.dll') {
            if (Get-ChildItem -File $hip -Filter $pattern) { Write-Host "  ok      $pattern" }
            else { Write-Host "  MISSING $pattern"; $missing = 1 }
          }
          if ($missing) { Write-Host "::error::the hip component lacks part of the ROCm runtime"; exit 1 }

          Get-ChildItem $env:DIST -Directory | ForEach-Object {
            $bytes = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
            '{0}: {1:N0} MiB' -f $_.Name, ($bytes / 1MB)
          }

      # The top-level project needs CURL to configure, though the backend never links it.
      - name: Install CURL
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl --triplet x64-windows-static

      # Through the top-level project, as on Linux: the backend takes the export macro from the core headers. The compiler must be
      # AdaptiveCpp's clang: the launcher hands its command line to acpp. C is pinned to the same clang: left unset, CMake picks cl.exe
      # from the MSVC environment, and refuses to mix it with a GNU-style clang.
      - name: Configure AUSAXS backend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build-gpu -G Ninja `
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" `
            "-DCMAKE_C_COMPILER=$env:ACPP_PREFIX\bin\clang.exe" `
            "-DCMAKE_CXX_COMPILER=$env:ACPP_PREFIX\bin\clang.exe" `
            "-DAdaptiveCpp_ROOT=$env:ACPP_PREFIX" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBUILD_TESTS=OFF `
            -DBUILD_EXECUTABLES=OFF

      - name: Build backend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build-gpu --target ausaxs_gpu_sycl

      - name: Check exported ABI symbols
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $lib = 'build-gpu\bin\ausaxs_gpu_sycl.dll'
          if (-not (Test-Path $lib)) { Write-Host "::error::$lib was not built"; exit 1 }
          $expected = Select-String -Path include\gpu\gpu\GPUBackendABI.h -Pattern 'symbol_[a-z_]+ *= *"(ausaxs_gpu_[a-z_]+)"' `
            | ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
          if (-not $expected) { Write-Host "::error::no ABI symbols found in the header"; exit 1 }
          $exports = dumpbin /nologo /exports $lib | Out-String
          $missing = 0
          foreach ($sym in $expected) {
            if ($exports -match "\b$sym\b") { Write-Host "  ok      $sym" }
            else { Write-Host "  MISSING $sym"; $missing = 1 }
          }
          exit $missing

      - name: Assemble runtime package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force $env:GPU_PACKAGE | Out-Null
          Get-ChildItem $env:DIST -Directory | ForEach-Object {
            Copy-Item -Recurse -Force "$($_.FullName)\*" $env:GPU_PACKAGE
          }
          Copy-Item build-gpu\bin\ausaxs_gpu_sycl.dll $env:GPU_PACKAGE

      - name: Prune runtime package
        run: python .github/prune_gpu_package.py $env:GPU_PACKAGE

      # Every DLL imported from inside the package must be shipped with it or come with Windows. Checked before the probe below, which
      # cannot name a missing dependency of a plugin: AdaptiveCpp only terminates. Even amdhip64 is shipped, although the driver
      # installs its own copy, so nothing is allowed from outside.
      - name: Check for dependencies outside the package
        run: |
          $files = Get-ChildItem -Recurse -File $env:GPU_PACKAGE -Include *.dll, *.exe
          $local = $files | ForEach-Object { $_.Name.ToLower() } | Sort-Object -Unique
          $system = Join-Path $env:SystemRoot 'System32'
          $outside = foreach ($f in $files) {
            dumpbin /nologo /dependents $f.FullName | ForEach-Object {
              if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1].ToLower() }
            }
          }
          $outside = @($outside | Sort-Object -Unique | Where-Object {
            ($local -notcontains $_) -and ($_ -notlike 'api-ms-win-*') -and ($_ -notlike 'ext-ms-*') -and
            -not (Test-Path (Join-Path $system $_))
          })
          $report = @('## Dependencies resolved outside the runtime package (Windows, HIP)', '```') + $outside + @('```')
          $report | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($outside.Count -gt 0) {
            Write-Host "::error::the package imports DLLs it does not ship: $($outside -join ', ')"
            exit 1
          }

      # The runner has no AMD GPU, so the backend is expected to load and report itself unavailable.
      - name: Load backend and query the ABI
        run: |
          $expected_version = [regex]::Match((Get-Content include\gpu\gpu\GPUBackendABI.h -Raw), 'version *= *([0-9]+)').Groups[1].Value
          Write-Host "Header declares ABI version $expected_version"
          $probe_src = @'
          #include <windows.h>
          #include <stdbool.h>
          #include <stdio.h>
          int main(int argc, char** argv) {
              // as the loader opens it: dependencies from the DLL's own directory, then the system's
              HMODULE h = LoadLibraryExA(argv[1], NULL, LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR | LOAD_LIBRARY_SEARCH_DEFAULT_DIRS);
              if (!h) {printf("LoadLibrary failed: error %lu\n", GetLastError()); return 2;}
              int (*abi_version)(void) = (int (*)(void)) GetProcAddress(h, "ausaxs_gpu_abi_version");
              bool (*available)(void) = (bool (*)(void)) GetProcAddress(h, "ausaxs_gpu_available");
              const char* (*last_error)(void) = (const char* (*)(void)) GetProcAddress(h, "ausaxs_gpu_last_error");
              if (!abi_version || !available || !last_error) {printf("GetProcAddress failed: error %lu\n", GetLastError()); return 3;}
              printf("abi_version=%d\n", abi_version());
              printf("available=%d\n", available() ? 1 : 0);
              const char* err = last_error();
              printf("last_error=%s\n", err ? err : "(none)");
              return 0;
          }
          '@
          Set-Content -Path "$env:RUNNER_TEMP\abi_probe.c" -Value $probe_src
          cl /nologo "$env:RUNNER_TEMP\abi_probe.c" "/Fo:$env:RUNNER_TEMP\abi_probe.obj" "/Fe:$env:RUNNER_TEMP\abi_probe.exe"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the probe did not compile"; exit 1 }

          # The package has to find itself, as it will on a user's machine, so PATH is cut down to the system directories. The runner's
          # PATH holds other toolchains, and AdaptiveCpp retries a plugin that fails to load with a plain LoadLibrary, which searches
          # PATH, so a DLL missing from the package would otherwise go unnoticed. The probe links the CRT statically and needs nothing
          # else. The version is parsed out of stdout, so bumping the ABI can never collide with the probe's exit codes.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = & "$env:RUNNER_TEMP\abi_probe.exe" "$PWD\$env:GPU_PACKAGE\ausaxs_gpu_sycl.dll" 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) {
            Write-Host "::error::the backend could not be loaded from the deployed package (probe exit $rc)"
            exit 1
          }
          $reported = [regex]::Match($out, '(?m)^abi_version=([0-9]+)').Groups[1].Value
          if ($reported -ne $expected_version) {
            Write-Host "::error::backend reports ABI version '$reported', header declares '$expected_version'"
            exit 1
          }
          Write-Host "ABI version $reported matches the header."

      - uses: actions/upload-artifact@v4
        with:
          name: ausaxs-gpu-windows-hip-x64-${{ github.sha }}
          path: ${{ env.GPU_PACKAGE }}
