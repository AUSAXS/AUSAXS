name: Build & test template

on: 
  workflow_call:
    inputs:
      package_permission:
        required: true
        type: boolean
        default: false

env:
  BUILD_TYPE: Release

jobs:
  check-sources:
    name: "Check the source conventions"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # the two cheap checks run first so a failure reports before anything is installed
      - name: Check headers
        run: python .github/check_headers.py

      - name: Check exceptions
        run: python .github/check_exceptions.py

      # Finds the newest commit on this branch whose conventions check already passed, so the
      # step below can analyse what changed since then rather than the whole pull request again.
      - id: verified
        uses: ./.github/actions/last-verified-sha
        with:
          workflow: build-and-test.yml
          # Substring of this job's `name:` above; workflow_call prefixes it with the calling
          # job's name, so it cannot be matched exactly.
          job-name: "Check the source conventions"
          head-sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check clang-tidy
        env:
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
        run: |
          set -euo pipefail
          # `comm` compares bytes while `sort` honours the locale, and they disagree on '/': the
          # locale ignores it, so `source/core/dataset/` sorts before `source/core/data/`, which
          # `comm` then rejects as unsorted. It exits non-zero when it does, so under `set -e` the
          # mismatch fails the check rather than merely mis-selecting files. One collation for both.
          export LC_ALL=C
          pr_files=$(git diff --name-only --diff-filter=d HEAD^ HEAD -- '*.cpp' '*.h' '*.tpp' | sort -u)

          scope="the whole pull request"
          if [ -n "$VERIFIED_SHA" ] && new=$(git diff --name-only --diff-filter=d "$VERIFIED_SHA" HEAD \
                                              -- '*.cpp' '*.h' '*.tpp' | sort -u); then
            pr_files=$(comm -12 <(printf '%s\n' "$pr_files") <(printf '%s\n' "$new"))
            scope="changes since ${VERIFIED_SHA:0:8}"
          fi

          files=$(printf '%s\n' "$pr_files" | tr '\n' ' ')
          if [ -z "${files// /}" ]; then
            echo "No C++ files to analyse (${scope})."
            exit 0
          fi
          echo "Analysing ${scope}: $files"
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev clang-tidy
          cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python scripts/run_clang_tidy.py --summary="$GITHUB_STEP_SUMMARY" $files

  build-win:
    name: "Windows MSVC"
    needs: check-sources
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/AUSAXS/index.json,${{ inputs.package_permission && 'readwrite' || 'read' }}"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      # pinned so the build does not float on the vcpkg bundled with the runner image
      - uses: lukka/run-vcpkg@v11
        id: vcpkg
        with:
          vcpkgGitCommitId: 4334d8b4c8916018600212ab4dd4bbdc343065d1

      - uses: ./.github/actions/setup-vcpkg-nuget
        with:
          package_permission: ${{ inputs.package_permission }}
          nuget_cmd: "$(vcpkg fetch nuget)"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        shell: pwsh
        run: |
          & "${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}\vcpkg.exe" install curl pkgconf --triplet x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the library
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . -G "Ninja" \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}\scripts\buildsystems\vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="x64-windows-static"
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12

      - name: Configure output folders for upload
        shell: bash
        run: |
          rm -rf build/lib/*.exp build/lib/*.lib

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/lib/*
            build/bin/*

  build-mac:
    name: "MacOS universal"
    needs: check-sources
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: | 
          brew install --quiet curl

      - name: Build the library
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DSAFE_CHECKS=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12

      - name: Configure build output folders for upload
        shell: bash
        run: |
          rm -rf build/lib/*.a

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-binaries
          path: |
            build/lib/*
            build/bin/*

      - name: Build tests
        run: cmake --build build --target tests -j12

      - name: Run tests
        run: |
          ctest --output-on-failure --parallel 6 --test-dir build/tests/unit
          ctest --output-on-failure --parallel 6 --test-dir build/tests/feature

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "junit-test-results-macos"
          path: build/tests/reports/*.xml
          retention-days: 1

  build-ubuntu:
    name: ${{ matrix.name }}
    needs: check-sources
    runs-on: ${{ matrix.os }}
    strategy: 
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "Ubuntu latest with GCC"
            c_compiler: gcc
            cpp_compiler: g++
            full_build: true

          - os: ubuntu-22.04
            name: "Ubuntu 22.04 with GCC"
            c_compiler: gcc-10
            cpp_compiler: g++-10
            full_build: false

          - os: ubuntu-24.04-arm
            name: "Ubuntu 24.04 ARM with GCC"
            c_compiler: gcc
            cpp_compiler: g++
            full_build: true

          - os: ubuntu-22.04-arm
            name: "Ubuntu 22.04 ARM with GCC"
            c_compiler: gcc-10
            cpp_compiler: g++-10
            full_build: false

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev
          if [ "${{ matrix.c_compiler }}" == "gcc-10" ]; then
            sudo apt-get install gcc-10 g++-10
          fi
          if [ $BUILD_TYPE == 'Debug' ]; then
            sudo apt-get install libdwarf-dev
          fi

      - name: Build the library (full build)
        if: matrix.full_build == true
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DSAFE_CHECKS=ON \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12

      - name: Build the library (${{ matrix.os }})
        if: matrix.full_build == false
        shell: bash
        run: |
          mkdir build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          cmake --build build --config $BUILD_TYPE --target libausaxs ausaxs -j12

      - name: Configure output folders for upload
        shell: bash
        run: |
          rm -rf build/lib/*.a

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-binaries
          path: |
            build/lib/*
            build/bin/*

      - name: Build tests
        if: matrix.full_build == true
        run: cmake --build build --target tests -j12

      - name: Run tests
        if: matrix.full_build == true
        run: |
          ctest --output-on-failure --parallel 6 --test-dir build/tests/unit
          ctest --output-on-failure --parallel 6 --test-dir build/tests/feature

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: matrix.full_build == true && always()
        with:
          name: "junit-test-results-${{ matrix.os }}"
          path: build/tests/reports/*.xml
          retention-days: 1