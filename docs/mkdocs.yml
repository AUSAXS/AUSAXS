site_name: AUSAXS
site_url: https://ausaxs.github.io/AUSAXS/
site_description: >-
  AUSAXS calculates SAXS and SANS profiles from atomic structures with the
  Debye equation, and fits PDB/CIF models and EM maps to small-angle scattering data.
site_author: Kristian Lytje
repo_url: https://github.com/AUSAXS/AUSAXS
repo_name: AUSAXS/AUSAXS
edit_uri: edit/master/docs/src/
copyright: AUSAXS is free software under the LGPL-3.0 license.

# Paths are relative to this file. The built site lands in the repository root, where the Pages workflow uploads it from.
docs_dir: src
site_dir: ../site

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch to light mode }

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - GPU acceleration: gpu.md
      - Troubleshooting: troubleshooting.md
      - Other installation methods:
          - Precompiled executables: precompiled-binaries.md
          - Compiling from source: compiling.md
  - Tutorials: tutorials.md
  - Applications:
      - Overview: applications.md
      - SAXS: saxs.md
      - SANS: sans.md
      - Rigid-body refinement: rigid-body-refinement.md
      - EM map validation: em.md
      - Crystals and nanoparticles: crystals.md
      - Powder diffraction: powder-diffraction.md
  - Documentation:
      - Command-line tools:
          - SAXS fitting: saxs-fitter.md
          - EM map validation: em-validation.md
          - Rigid-body refinement: rigidbody.md
          - CLI plotting: plotting-scripts.md
          - GPU driver: gpu-driver.md
      - Developers:
          - macOS debug build: macos-debug-build.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - github-callouts
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - !relative $config_dir/overrides/.icons
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - toc: { permalink: true }

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AUSAXS/AUSAXS
      name: AUSAXS on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyausaxs/
      name: pyAUSAXS on PyPI
    - icon: fontawesome/solid/book
      link: https://doi.org/10.1107/S160057672500562X
      name: AUSAXS paper (J. Appl. Cryst. 2025)

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css
  - stylesheets/extra.css

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
